spring.application.name=appointmentapp-backend
server.port=9090

# JPA / Hibernate
# Puedes quitar esta línea y Hibernate detecta MySQL solo:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# (Si la dejas, usa MySQLDialect en lugar de MySQL8Dialect para evitar el warning)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/appointmentapp?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
